<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>感知之门 - 后台管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #0d3b2e 0%, #1b4332 50%, #2d5016 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 2rem;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .admin-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: #52b788;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .nav-btn.active {
            background: #2d5016;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .admin-card {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: linear-gradient(135deg, #f8fff8 0%, #e8f5e8 100%);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border-left: 4px solid #52b788;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #0d3b2e;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #6c757d;
            font-size: 0.9rem;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .data-table th,
        .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .data-table th {
            background: #52b788;
            color: white;
            font-weight: 600;
        }

        .data-table tr:hover {
            background: #f8fff8;
        }

        .chart-container {
            margin: 20px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .filter-section {
            background: #e8f5e8;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .filter-group {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group select,
        .filter-group input {
            padding: 8px 12px;
            border: 2px solid #b7e4c7;
            border-radius: 6px;
            font-size: 14px;
        }

        .analysis-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .analysis-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #74c69d;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #52b788, #74c69d);
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <h1>🌿 感知之门 - 后台管理系统</h1>
        
        <div class="admin-nav">
            <button class="nav-btn active" onclick="showSection('overview')">📊 数据概览</button>
            <button class="nav-btn" onclick="showSection('users')">👥 用户分析</button>
            <button class="nav-btn" onclick="showSection('records')">📝 记录分析</button>
            <button class="nav-btn" onclick="showSection('trends')">📈 趋势分析</button>
            <button class="nav-btn" onclick="showSection('export')">📤 数据导出</button>
        </div>

        <!-- 数据概览 -->
        <div id="overview" class="admin-section">
            <div class="admin-card">
                <h2>📊 整体数据概览</h2>
                <div class="stats-grid" id="overviewStats">
                    <!-- 动态生成统计卡片 -->
                </div>
                
                <div class="chart-container">
                    <h3>用户活跃度分布</h3>
                    <div id="activityChart"></div>
                </div>
            </div>
        </div>

        <!-- 用户分析 -->
        <div id="users" class="admin-section" style="display: none;">
            <div class="admin-card">
                <h2>👥 用户分析</h2>
                
                <div class="filter-section">
                    <div class="filter-group">
                        <label>筛选条件：</label>
                        <select id="ageFilter">
                            <option value="">所有年龄</option>
                            <option value="18-25">18-25岁</option>
                            <option value="26-35">26-35岁</option>
                            <option value="36-50">36-50岁</option>
                            <option value="50+">50岁以上</option>
                        </select>
                        <select id="locationFilter">
                            <option value="">所有居住地</option>
                            <option value="大城市中心">大城市中心</option>
                            <option value="城市郊区">城市郊区</option>
                            <option value="小城镇">小城镇</option>
                            <option value="乡村">乡村</option>
                            <option value="山区">山区</option>
                        </select>
                        <button class="nav-btn" onclick="applyUserFilters()">应用筛选</button>
                    </div>
                </div>

                <div class="analysis-section">
                    <div class="analysis-card">
                        <h3>年龄分布</h3>
                        <div id="ageDistribution"></div>
                    </div>
                    <div class="analysis-card">
                        <h3>居住地分布</h3>
                        <div id="locationDistribution"></div>
                    </div>
                    <div class="analysis-card">
                        <h3>兴趣标签热度</h3>
                        <div id="interestHeatmap"></div>
                    </div>
                </div>

                <table class="data-table" id="usersTable">
                    <thead>
                        <tr>
                            <th>用户ID</th>
                            <th>年龄</th>
                            <th>性别</th>
                            <th>居住地</th>
                            <th>绿色含量</th>
                            <th>记录数</th>
                            <th>最后活跃</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- 动态生成用户数据 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 记录分析 -->
        <div id="records" class="admin-section" style="display: none;">
            <div class="admin-card">
                <h2>📝 记录分析</h2>
                
                <div class="analysis-section">
                    <div class="analysis-card">
                        <h3>记录类型分布</h3>
                        <div id="recordTypeChart"></div>
                    </div>
                    <div class="analysis-card">
                        <h3>任务完成情况</h3>
                        <div id="taskCompletionChart"></div>
                    </div>
                    <div class="analysis-card">
                        <h3>感官体验使用率</h3>
                        <div id="sensoryUsageChart"></div>
                    </div>
                </div>

                <table class="data-table" id="recordsTable">
                    <thead>
                        <tr>
                            <th>记录ID</th>
                            <th>用户</th>
                            <th>任务类型</th>
                            <th>记录时间</th>
                            <th>文字</th>
                            <th>图片</th>
                            <th>录音</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- 动态生成记录数据 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 趋势分析 -->
        <div id="trends" class="admin-section" style="display: none;">
            <div class="admin-card">
                <h2>📈 趋势分析</h2>
                
                <div class="analysis-section">
                    <div class="analysis-card">
                        <h3>用户增长趋势</h3>
                        <div id="userGrowthTrend"></div>
                    </div>
                    <div class="analysis-card">
                        <h3>记录活跃度趋势</h3>
                        <div id="recordActivityTrend"></div>
                    </div>
                    <div class="analysis-card">
                        <h3>功能使用趋势</h3>
                        <div id="featureUsageTrend"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 数据导出 -->
        <div id="export" class="admin-section" style="display: none;">
            <div class="admin-card">
                <h2>📤 数据导出</h2>
                
                <div class="filter-section">
                    <h3>选择导出数据</h3>
                    <div class="filter-group">
                        <label><input type="checkbox" id="exportUsers" checked> 用户数据</label>
                        <label><input type="checkbox" id="exportRecords" checked> 记录数据</label>
                        <label><input type="checkbox" id="exportStats" checked> 统计数据</label>
                    </div>
                    <div class="filter-group" style="margin-top: 15px;">
                        <label>时间范围：</label>
                        <input type="date" id="startDate">
                        <label>到</label>
                        <input type="date" id="endDate">
                        <button class="nav-btn" onclick="exportData()">导出数据</button>
                    </div>
                </div>

                <div class="analysis-section">
                    <div class="analysis-card">
                        <h3>导出预览</h3>
                        <div id="exportPreview">
                            <p>选择导出选项后，这里将显示数据预览</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
